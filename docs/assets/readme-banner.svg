      <rect x="417" y="249" width="140" height="43" rx="21.5" fill="#18384b" stroke="#31556b"/>
      <circle cx="439" cy="270" r="4" fill="#b1b6ff"/>
      <text x="454" y="276">可选交付审核</text>
