    <text x="64" y="344" fill="#f0f6fc" font-size="19">输入包名安装，登录即可开始。</text>
    <text x="64" y="414" fill="#85a7bd" font-size="16">dsh-deepseek-web-littlecar30</text>
    <rect x="756" y="88" width="448" height="284" rx="18" fill="#041320" fill-opacity=".45"/>
    <rect x="774" y="68" width="442" height="296" rx="17" fill="#f4f8fc"/>
    <path d="M791 68H1199Q1216 68 1216 85V114H774V85Q774 68 791 68" fill="#e4edf5"/>
