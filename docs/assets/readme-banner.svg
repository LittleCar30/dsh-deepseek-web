<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek 网页通道</title>
  <desc id="desc">通过真实 Edge 或 Chrome 网页连接 dsh，支持半自动、全自动和可选交付审核。右侧为流程示意。</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b162b"/>
      <stop offset="1" stop-color="#112e44"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#6ee7df"/>
      <stop offset="1" stop-color="#72abff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#2c99a7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2c99a7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="460" rx="24" fill="url(#background)"/>
  <ellipse cx="1080" cy="310" rx="380" ry="320" fill="url(#glow)"/>
  <path d="M0 390H1280M724 0V460" stroke="#83b4d4" stroke-opacity=".07"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="64" y="52" width="30" height="25" rx="6" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <path d="M64 60H94M72 70L77 66M72 70L77 74M82 74H88" fill="none" stroke="#87e6e3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
