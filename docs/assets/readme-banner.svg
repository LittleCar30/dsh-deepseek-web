    <circle cx="826" cy="91" r="4" fill="#a9bacb"/>
    <rect x="851" y="78" width="271" height="25" rx="7" fill="#f6f9fc"/>
    <text x="872" y="95" fill="#526c83" font-size="13">chat.deepseek.com</text>
    <text x="802" y="146" fill="#486078" font-size="13">真实网页 · 流程示意</text>
    <rect x="802" y="166" width="204" height="48" rx="13" fill="#e5edf6"/>
